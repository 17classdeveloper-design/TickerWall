<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TickerWall Privacy Policy</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #070a0f;
  --panel: #121821;
  --text: #f2f5f8;
  --muted: #9aa5b4;
  --accent: #fcd535;
  --line: rgba(255,255,255,.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 18px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at 20% 0%, rgba(252,213,53,.16), transparent 32rem), var(--bg);
  color: var(--text);
}
main {
  width: min(920px, calc(100% - 48px));
  margin: 0 auto;
  padding: 64px 0 88px;
}
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 40px;
}
a {
  color: var(--accent);
  text-decoration: none;
}
nav a {
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text);
  padding: 8px 14px;
}
nav a.active {
  background: var(--accent);
  color: #111;
  border-color: var(--accent);
}
article {
  background: rgba(18,24,33,.78);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: clamp(28px, 5vw, 56px);
  box-shadow: 0 28px 80px rgba(0,0,0,.35);
}
h1 {
  font-size: clamp(36px, 6vw, 64px);
  line-height: 1.08;
  margin: 0 0 20px;
}
h2 {
  color: var(--accent);
  font-size: 24px;
  margin: 34px 0 8px;
}
p {
  margin: 0 0 18px;
  color: var(--muted);
}
footer {
  color: var(--muted);
  margin-top: 28px;
  font-size: 14px;
}
</style>
</head>
<body>
  <main>
    <article>
      <h1>TickerWall Privacy Policy</h1>
      <p>Select your language.</p>
      <ul>
        <li><a href="en/">English</a></li><li><a href="ja/">日本語</a></li><li><a href="ko/">한국어</a></li><li><a href="zh-Hans/">简体中文</a></li><li><a href="zh-Hant/">繁體中文</a></li>
      </ul>
    </article>
  </main>
</body>
</html>
